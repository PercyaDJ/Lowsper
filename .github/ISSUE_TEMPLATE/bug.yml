name: Signaler un problème
description: Quelque chose ne fonctionne pas comme prévu.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème.
        **N'ajoutez aucun transcript, aucun enregistrement, aucun nom de personne ou d'entreprise réels.**
        Pour une faille de sécurité, n'ouvrez pas d'issue publique : voir SECURITY.md.
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui se passe
      description: Décrivez le problème et ce que vous attendiez à la place.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour le reproduire
      placeholder: |
        1. Ouvrir Lowsper.html
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de Lowsper
      description: Voir CHANGELOG.md ou le nom du dossier téléchargé.
      placeholder: 3.0.0
    validations:
      required: true
  - type: input
    id: navigateur
    attributes:
      label: Navigateur et système
      placeholder: Edge 140, Windows 11
    validations:
      required: true
  - type: input
    id: modele
    attributes:
      label: Modèle de transcription
      placeholder: Whisper small
  - type: textarea
    id: journal
    attributes:
      label: Journal technique
      description: Écran de fin, bouton « Journal technique ». Il ne contient aucun texte de réunion. Relisez-le avant de le joindre.
